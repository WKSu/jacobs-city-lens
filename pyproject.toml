[project]
name = "jacobs-city-lens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "networkx>=3.7",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
